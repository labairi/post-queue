<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Desk</title>
<style>
:root{--bg:#f6f4ef;--panel:#fffdf8;--ink:#1d2320;--mute:#5d6862;--line:#ddd8cc;--accent:#14604a;--accent-ink:#fff;--warn:#8a5a00;--warn-bg:#fff1cf;--bad:#9c2a1f;--bad-bg:#fde4df;--good:#14604a;--good-bg:#dff1e8;--info-bg:#e6edf5;--info:#274a72;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--panel:#1c211d;--ink:#e8ece7;--mute:#9aa59e;--line:#2f3832;--accent:#5fc19c;--accent-ink:#0c1a14;--warn:#f0c26a;--warn-bg:#3a2f12;--bad:#ff9a8c;--bad-bg:#3d1c18;--good:#7fd8b2;--good-bg:#173528;--info-bg:#1a2938;--info:#9cc2ee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;padding-block:16px 48px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 8px}
nav{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0 16px;border-bottom:1px solid var(--line);padding-bottom:8px}
nav button{background:none;border:1px solid transparent;color:var(--mute);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button[aria-current=page]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
button,.btn{font:inherit;cursor:pointer}
.b{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:7px 12px}
.b.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.b.danger{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.b:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{color:var(--mute);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.split{justify-content:space-between}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.pill.published{background:var(--good-bg);color:var(--good)}
.pill.scheduled,.pill.publishing{background:var(--info-bg);color:var(--info)}
.pill.failed,.pill.cancelled{background:var(--bad-bg);color:var(--bad)}
.pill.uncertain,.pill.partial{background:var(--warn-bg);color:var(--warn)}
.pill.draft{color:var(--mute)}
.mute{color:var(--mute)}.small{font-size:13px}
.notice{padding:10px 12px;border-radius:8px;margin:0 0 12px;border:1px solid var(--line)}
.notice.err{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.notice.ok{background:var(--good-bg);color:var(--good)}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.info{background:var(--info-bg);color:var(--info)}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}
input,select,textarea{width:100%;max-width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto}
.cols{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cnt{font-size:12px;color:var(--mute);text-align:right}.cnt.over{color:var(--bad);font-weight:700}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:10px 0;min-width:0}
.list li:first-child{border-top:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
code,pre{font-family:var(--mono);font-size:12.5px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal>div{border:1px solid var(--line);border-radius:6px;min-height:70px;padding:4px;font-size:12px;overflow:hidden}
.cal .h{min-height:0;border:0;color:var(--mute);font-weight:600}
.cal .ev{display:block;background:var(--info-bg);color:var(--info);border-radius:3px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;width:100%;text-align:left;font-size:12px}
.media{display:flex;flex-wrap:wrap;gap:8px}.media figure{margin:0;width:130px}.media img,.media video{width:130px;height:90px;object-fit:cover;border-radius:6px;background:var(--line)}
.media figcaption{font-size:11px;word-break:break-all}
.chk{display:inline-flex;gap:6px;align-items:center;margin:4px 14px 0 0;font-weight:400}
label.sub{font-weight:500;color:var(--mute);margin-top:4px}
.badtxt{color:var(--bad)}.stats{display:flex;flex-wrap:wrap;gap:6px 18px}.stats b{font-size:18px}
.cal .blank{border:0;min-height:0}.cal .day{min-height:78px}.cal .day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.add{background:none;border:1px solid var(--line);color:var(--mute);border-radius:4px;width:20px;height:20px;line-height:1;padding:0;font-size:14px}.add:hover{color:var(--accent);border-color:var(--accent)}
.cal .ev.published{background:var(--good-bg);color:var(--good)}.cal .ev.failed,.cal .ev.cancelled{background:var(--bad-bg);color:var(--bad)}.cal .ev.uncertain,.cal .ev.partial{background:var(--warn-bg);color:var(--warn)}.cal .ev.draft{background:var(--bg);color:var(--mute);border:1px dashed var(--line)}
.mrow{display:flex;gap:10px;align-items:center;margin:6px 0}.thumb{width:84px;height:64px;flex:none;background:var(--line);border-radius:6px;overflow:hidden}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.tile{margin:0}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:min(460px,92vw)}
@media (max-width:560px){.cal>div{min-height:48px}.cal .ev{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Content Desk <span class="mute small" id="repoLabel"></span></h1>
  <div class="row"><label class="small mute" for="wsSel" style="margin:0">Workspace</label><select id="wsSel" style="width:auto;min-width:150px" aria-label="Workspace"></select><button class="b alt" id="wsAdd" title="New workspace" aria-label="New workspace" hidden>＋</button><span class="small mute" id="loaded"></span><button class="b alt" id="reload">Reload</button></div>
</header>
<nav id="nav" aria-label="Sections"></nav>
<div id="msg" role="status" aria-live="polite"></div>
<main id="view"></main>
</div>
<dialog id="dlg"><form method="dialog"><p id="dlgText"></p><div class="row"><button class="b danger" value="ok" id="dlgOk">Yes</button><button class="b alt" value="cancel">Cancel</button></div></form></dialog>

<script>
/*RULES*/const RULES = {"bluesky": {"image": true, "label": "Bluesky", "max_chars": 300, "max_images": 4, "requires_media": false, "requires_video": false, "status": "implemented", "title_required": false, "video": false}, "facebook_page": {"image": true, "label": "Facebook Page", "max_chars": 63206, "max_images": 1, "requires_media": false, "requires_video": false, "status": "implemented", "title_required": false, "video": true}, "instagram": {"daily_cap": 100, "image": true, "image_ext": ["jpg", "jpeg"], "label": "Instagram", "max_chars": 2200, "max_images": 1, "requires_media": true, "requires_video": false, "status": "implemented", "title_required": false, "video": true}, "linkedin": {"image": true, "label": "LinkedIn", "max_chars": 3000, "max_images": 20, "requires_media": false, "requires_video": false, "status": "not_implemented", "title_required": false, "video": true, "why": "Needs the LinkedIn 'Share on LinkedIn' product; company pages need Community Management API approval."}, "linkedin_page": {"image": true, "label": "LinkedIn Page", "max_chars": 3000, "max_images": 20, "requires_media": false, "requires_video": false, "status": "not_implemented", "title_required": false, "video": true, "why": "Company pages need Community Management API approval (about 1 to 2 weeks)."}, "mastodon": {"image": true, "label": "Mastodon", "max_chars": 500, "max_images": 4, "requires_media": false, "requires_video": false, "status": "implemented", "title_required": false, "video": true}, "threads": {"daily_cap": 250, "image": true, "label": "Threads", "max_chars": 500, "max_images": 1, "requires_media": false, "requires_video": false, "status": "implemented", "title_required": false, "video": true}, "tiktok": {"image": false, "label": "TikTok", "max_chars": 2200, "max_images": 0, "requires_media": true, "requires_video": true, "status": "not_implemented", "title_required": false, "video": true, "why": "Posts from an unaudited app are private-only until TikTok audits the app."}, "x": {"image": true, "label": "X", "max_chars": 280, "max_images": 4, "requires_media": false, "requires_video": false, "status": "not_implemented", "title_required": false, "video": true, "why": "X has no free posting tier for new developers; posting is pay-per-use."}, "youtube": {"image": false, "label": "YouTube", "max_chars": 5000, "max_images": 0, "requires_media": true, "requires_video": true, "status": "not_implemented", "title_max": 100, "title_required": true, "video": true, "why": "Needs a Google Cloud project with OAuth consent; check the upload quota and visibility rules for unverified projects."}};/*END*/
const PAGES = [["calendar","Calendar"],["compose","New post"],["posts","Posts"],["accounts","Accounts"],["setup","Setup"]];
const WORKFLOW = "social-publish.yml";
const TOP_KEYS = ["id","title","campaign","hook","headline","description","primary","alt","cta","hashtags","intent","scheduled","targets","versions","media","settings","created_at","updated_at","notes"];
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- settings (kept in this browser only) ---------- */
let mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
const cfg = () => ({ owner: store.get("pq.owner")||"", repo: store.get("pq.repo")||"", branch: store.get("pq.branch")||"main", path: (store.get("pq.path")??"").replace(/^\/+|\/+$/g,""),
  token: store.get("pq.token")||"", mediaRepo: store.get("pq.mediaRepo")||"", mediaPath: (store.get("pq.mediaPath")||"media").replace(/^\/+|\/+$/g,"") });

/* ---------- GitHub API ---------- */
class ApiError extends Error { constructor(status, message){ super(message); this.status = status; } }
async function gh(method, url, body){
  const c = cfg();
  if(!c.token) throw new ApiError(0, "Add your GitHub token in Setup first.");
  let r;
  try {
    r = await fetch("https://api.github.com" + url, { method, headers: { "Accept":"application/vnd.github+json", "Authorization":"Bearer "+c.token, "X-GitHub-Api-Version":"2022-11-28", ...(body ? {"Content-Type":"application/json"} : {}) }, body: body ? JSON.stringify(body) : undefined });
  } catch(e){ throw new ApiError(0, "Could not reach GitHub (network). " + e.message); }
  if(r.status === 204) return null;
  let j = null; try { j = await r.json(); } catch(e){}
  if(!r.ok){
    const m = (j && j.message) || r.statusText;
    const hint = r.status===401 ? " The token was rejected: it may be expired or wrong." : r.status===403 ? " The token may lack permission, or the rate limit was hit." : r.status===404 ? " Not found, or the token cannot see this repository." : r.status===409||r.status===422 ? " The file changed since it was loaded. Reload and try again." : "";
    throw new ApiError(r.status, `GitHub said ${r.status}: ${m}.${hint}`);
  }
  return j;
}
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\n/g,"")), c => c.charCodeAt(0)));
const b64e = s => { const b = new TextEncoder().encode(s); let t=""; for(const x of b) t+=String.fromCharCode(x); return btoa(t); };
const repoUrl = () => { const c = cfg(); return `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`; };
const fpath = p => cfg().path ? cfg().path + "/" + p : p;
async function readFile(p){
  try { const j = await gh("GET", `${repoUrl()}/contents/${fpath(p)}?ref=${encodeURIComponent(cfg().branch)}`); return { text: b64d(j.content), sha: j.sha }; }
  catch(e){ if(e.status===404) return null; throw e; }
}
async function readJson(p, dflt){ const f = await readFile(p); if(!f) return dflt; try { return JSON.parse(f.text); } catch(e){ return { __broken: true, error: e.message }; } }
async function listDir(p){ try { const j = await gh("GET", `${repoUrl()}/contents/${fpath(p)}?ref=${encodeURIComponent(cfg().branch)}`); return Array.isArray(j) ? j : []; } catch(e){ if(e.status===404) return []; throw e; } }
async function writeFile(p, text, msg, sha){
  return gh("PUT", `${repoUrl()}/contents/${fpath(p)}`, { message: msg, content: b64e(text), branch: cfg().branch, ...(sha ? {sha} : {}) });
}
async function deleteFile(p, sha, msg){ return gh("DELETE", `${repoUrl()}/contents/${fpath(p)}`, { message: msg, sha, branch: cfg().branch }); }
async function dispatch(mode, allow){
  return gh("POST", `${repoUrl()}/actions/workflows/${WORKFLOW}/dispatches`, { ref: cfg().branch, inputs: { mode, allow_publish: allow ? "true" : "false" } });
}

/* ---------- mirrors of the Python rules (checked against rules.py by a test) ---------- */
const hashtagify = t => { t = String(t).replace(/[^\p{L}\p{N}_]/gu,""); return t ? "#"+t : ""; };
function derivedText(post, platform){
  const r = RULES[platform]; const v = (post.versions||{})[platform]||{};
  let title = (v.title||"").trim();
  if(v.text != null && String(v.text).trim()) return [title, String(v.text).trim()];
  const primary = (post.primary || post.alt || "").trim(), cta = (post.cta||"").trim();
  const tags = (post.hashtags||[]).map(hashtagify).filter(Boolean).join(" ");
  const short = (post.alt || primary).trim();
  const hook = ((post.hook||"") + " " + (post.headline||"")).trim();
  const join = (...p) => p.filter(Boolean).join("\n\n"), one = (...p) => p.filter(Boolean).join(" ");
  const cands = [join(primary,cta,tags), join(primary,cta), join(short,cta,tags), join(short,cta), one(hook,cta), short, primary, hook].filter(Boolean);
  if(platform==="youtube" && !title) title = (post.headline||post.title||"").trim().slice(0, r.title_max||100);
  for(const c of cands) if([...c].length <= r.max_chars) return [title, c];
  return [title, cands.length ? cands[cands.length-1] : ""];
}
const len = s => [...String(s)].length;
function localToUtcMs(local, tz){
  // Resolve a wall-clock time in an IANA zone to a UTC instant, rejecting gaps and overlaps like the publisher does.
  const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)$/.exec(local||""); if(!m) throw new Error("Pick a date and time.");
  const [Y,Mo,D,h,mi] = m.slice(1).map(Number);
  const asUtc = Date.UTC(Y,Mo-1,D,h,mi);
  let fmt; try { fmt = new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric"}); } catch(e){ throw new Error("Unknown time zone: "+tz); }
  const offsetAt = ms => { const p = Object.fromEntries(fmt.formatToParts(new Date(ms)).map(x=>[x.type,x.value])); return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute) - ms; };
  const cands = new Set([asUtc - offsetAt(asUtc - 864e5/2), asUtc - offsetAt(asUtc + 864e5/2)]);
  const ok = [...cands].filter(ms => offsetAt(ms) + ms === asUtc);
  if(ok.length === 0) throw new Error(`${local} does not exist in ${tz} (clocks skip it). Choose another time.`);
  if(ok.length > 1) throw new Error(`${local} happens twice in ${tz} (clocks go back). Choose another time.`);
  return ok[0];
}
function validatePost(p, accounts, forSchedule){
  const e = [];
  if(!/^[a-z0-9][a-z0-9-]{2,79}$/.test(p.id||"")) e.push("The id must be 3 to 80 characters: lowercase letters, digits, hyphens.");
  const sched = forSchedule ?? (p.intent==="scheduled");
  if(sched){
    if(!p.scheduled || !p.scheduled.local || !p.scheduled.tz) e.push("Pick a date, time and time zone to schedule.");
    else { try { localToUtcMs(p.scheduled.local, p.scheduled.tz); } catch(x){ e.push(x.message); } }
  }
  const media = p.media||[]; media.forEach((m,i) => { if(!/^https:\/\/\S+$/.test(m.url||"")) e.push(`Media ${i+1}: the address must be a public https link.`); });
  const targets = p.targets||[]; if(!targets.length) e.push("Choose at least one account.");
  const imgs = media.filter(m=>m.type==="image").length, vids = media.filter(m=>m.type==="video").length;
  for(const t of targets){
    const a = accounts[t.account]; if(!a){ e.push(`Unknown account: ${t.account}`); continue; }
    const r = RULES[a.platform]; if(!r){ e.push(`${a.id}: unknown platform`); continue; }
    const label = `${r.label} (${a.id})`;
    if(r.status!=="implemented"){ e.push(`${label}: publishing to ${r.label} is not built yet. ${r.why||""}`.trim()); continue; }
    const [title, text] = derivedText(p, a.platform);
    if(len(text) > r.max_chars) e.push(`${label}: ${len(text)} characters, over the ${r.max_chars} limit.`);
    if(r.requires_media && !(imgs||vids)) e.push(`${label}: needs an image or a video.`);
    if(vids && !r.video) e.push(`${label}: does not take video here.`);
    if(imgs && !r.image) e.push(`${label}: does not take images.`);
    if(r.image_ext) media.forEach(m => { if(m.type==="image"){ const ext = (m.url||"").split("?")[0].split(".").pop().toLowerCase(); if(!r.image_ext.includes(ext)) e.push(`${label}: images must be ${r.image_ext.join("/").toUpperCase()} (this one is .${ext}).`); } });
    if(r.max_images>0 && imgs > r.max_images) e.push(`${label}: takes at most ${r.max_images} image(s).`);
    if(vids>1) e.push(`${label}: takes one video.`); if(vids && imgs) e.push(`${label}: cannot mix a video and images.`);
    if(r.title_required && !title) e.push(`${label}: a title is required.`);
    if(!text && !(imgs||vids)) e.push(`${label}: nothing to post.`);
  }
  return e;
}
function displayStatus(post, st){
  if(st && st.cancelled) return "cancelled";
  const ts = Object.values((st||{}).targets||{}).map(t=>t.status);
  if(ts.length){
    if(ts.includes("publishing")) return "publishing";
    if(ts.includes("published") && ts.every(s=>s==="published"||s==="skipped")) return "published";
    if(ts.includes("published") && ts.some(s=>["failed","uncertain","pending"].includes(s))) return "partial";
    if(ts.includes("uncertain")) return "uncertain";
    if(ts.includes("failed")) return "failed";
  }
  return post.intent==="scheduled" ? "scheduled" : "draft";
}

/* ---------- data ---------- */
let D = null;          // { accounts, workspaces, posts:{id:{post,sha}}, states:{id:state}, log:[], setup, runs, at }
let route = "calendar", editing = null, filter = "all", calY = null, calM = null, connecting = null, justAdded = null, uploading = 0;

function say(kind, text){ $("#msg").innerHTML = text ? `<div class="notice ${kind}">${esc(text)}</div>` : ""; }
async function load(){
  const c = cfg();
  $("#repoLabel").textContent = "";
  if(!c.token || !c.owner || !c.repo){ D = null; return; }
  say("info", "Loading…");
  const out = { posts:{}, states:{}, log:[], runs:null, errors:[] };
  try {
    const acc = await readJson("config/accounts.json", {accounts:[]});
    out.accounts = Object.fromEntries(((acc && acc.accounts)||[]).map(a=>[a.id,a]));
    const [pl, sl] = await Promise.all([listDir("queue/posts"), listDir("queue/state")]);
    await Promise.all(pl.filter(f=>f.name.endsWith(".json")).map(async f => {
      const x = await readFile("queue/posts/"+f.name); try { out.posts[f.name.slice(0,-5)] = { post: JSON.parse(x.text), sha: x.sha }; } catch(e){ out.errors.push(`${f.name} is not valid JSON`); }
    }));
    await Promise.all(sl.filter(f=>f.name.endsWith(".json")).map(async f => {
      const x = await readFile("queue/state/"+f.name); try { out.states[f.name.slice(0,-5)] = JSON.parse(x.text); } catch(e){ out.errors.push(`state ${f.name} is not valid JSON`); }
    }));
    const lg = await readFile("queue/log.jsonl");
    out.log = lg ? lg.text.split("\n").filter(Boolean).map(l=>{ try { return JSON.parse(l); } catch(e){ return null; } }).filter(Boolean) : [];
    out.setup = await readJson("status/setup.json", null);
    const wf = await readJson("config/workspaces.json", null);
    out.workspaces = wf && !wf.__broken && Array.isArray(wf.workspaces) && wf.workspaces.length ? wf.workspaces : [];
    try { out.runs = (await gh("GET", `${repoUrl()}/actions/workflows/${WORKFLOW}/runs?per_page=15`)).workflow_runs; } catch(e){ out.errors.push("Workflow runs: " + e.message); }
    out.at = new Date(); D = out; say("", "");
    $("#loaded").textContent = "Loaded " + out.at.toLocaleTimeString();
    if(out.errors.length) say("warn", out.errors.join(" · "));
  } catch(e){ D = null; say("err", e.message); }
}
const hasWs = () => D && D.workspaces.length > 0;
const curWs = () => { const l = D.workspaces, w = store.get("pq.ws"); return l.find(x=>x.id===w) || l[0]; };

/* ---------- time helpers ---------- */
function localFromMs(ms, tz){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
const browserTz = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch(e){ return "UTC"; } };
const wsTz = () => (curWs() && curWs().tz) || browserTz();
function zones(){ try { return Intl.supportedValuesOf("timeZone"); } catch(e){ return ["UTC","Africa/Casablanca","Europe/Paris","Europe/London","America/New_York","America/Los_Angeles","Asia/Dubai","Asia/Tokyo"]; } }
const nextHourLocal = tz => { const t = new Date(Date.now() + 3600e3); t.setMinutes(0,0,0); return localFromMs(t.getTime(), tz); };

/* ---------- actions ---------- */
function confirmBox(text){ return new Promise(res => { const d = $("#dlg"); $("#dlgText").textContent = text; d.addEventListener("close", () => res(d.returnValue==="ok"), {once:true}); d.returnValue = ""; if(d.showModal) d.showModal(); else res(true); }); }
async function command(obj, okMsg){
  try { await writeFile(`queue/commands/${crypto.randomUUID()}.json`, JSON.stringify(obj, null, 2)+"\n", `social: ${obj.action} ${obj.post_id}`); if(okMsg) say("ok", okMsg); return true; }
  catch(e){ say("err", e.message); return false; }
}
async function runQueue(mode, allow){
  try { await dispatch(mode, allow); say("ok", mode==="publish-due" ? "Started. Posts that are due are being published. Press Reload in about a minute." : `Started “${mode}”. It takes about a minute. Press Reload afterwards.`); return true; }
  catch(e){ say("err", e.message + (e.status===404 ? " (Is the workflow file on the branch you configured?)" : "")); return false; }
}
function sortKeys(o){ const s = v => Array.isArray(v) ? v.map(s) : (v && typeof v==="object") ? Object.fromEntries(Object.keys(v).sort().map(k=>[k,s(v[k])])) : v; return JSON.stringify(s(o), null, 2)+"\n"; }
async function savePost(post){
  const cur = D && D.posts[post.id];
  const out = { ...post }; out.updated_at = new Date().toISOString().replace(/\.\d+Z$/,"Z"); out.created_at = out.created_at || out.updated_at;
  const clean = Object.fromEntries(Object.entries(out).filter(([k,v]) => TOP_KEYS.includes(k) && v !== undefined));
  await writeFile(`queue/posts/${post.id}.json`, sortKeys(clean), `social: save ${post.id}`, cur && cur.sha);
}
const slugify = t => { const s = String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,30).replace(/-+$/,""); return s.length>=3 ? s : "post"; };

V.calendar = () => {

  const y = calY ?? now.getFullYear(), m = calM ?? now.getMonth();
  const first = new Date(y,m,1), pad = (first.getDay()+6)%7, days = new Date(y,m+1,0).getDate();
  const by = {}; myIds().forEach(id => { const p = D.posts[id].post; if(p.scheduled && p.scheduled.local) (by[p.scheduled.local.slice(0,10)] ||= []).push(id); });

  let cells = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="h">${d}</div>`).join("") + "<div class='blank'></div>".repeat(pad);

};

function readForm(){

  p.targets = [...document.querySelectorAll("[data-acc]")].filter(x=>x.checked).map(x=>({account:x.dataset.acc}));
  const l = $("#f_local"), z = $("#f_tz"); p.scheduled = { local: l ? l.value : "", tz: z ? z.value : browserTz() };

  document.querySelectorAll("[data-ver]").forEach(el => { const k = el.dataset.ver; if(el.value.trim()) p.versions[k] = { ...(p.versions[k]||{}), text: el.value }; else if(p.versions[k]){ delete p.versions[k].text; if(!Object.keys(p.versions[k]).length) delete p.versions[k]; } });

}
function refreshCompose(){
  if(route!=="compose" || !editing) return; readForm();
  const p = editing, accs = D.accounts||{};
  const plats = [...new Set(p.targets.map(t=>(accs[t.account]||{}).platform).filter(x=>RULES[x]&&RULES[x].status==="implemented"))];
  $("#counts").innerHTML = p.targets.map(t => { const a = accs[t.account]; if(!a||!RULES[a.platform]) return ""; const r = RULES[a.platform], n = len(derivedText(p, a.platform)[1]); return `<span class="cnt ${n>r.max_chars?"over":""}" style="margin-right:12px">${esc(r.label)} ${n}/${r.max_chars}</span>`; }).join("");
  const vh = $("#versions"); const sig = plats.join(",") + "|" + JSON.stringify(p.versions||{});
  if(vh.dataset.sig !== sig){ vh.innerHTML = plats.map(pl => `<label>${esc(RULES[pl].label)}</label><textarea data-ver="${pl}">${esc(((p.versions||{})[pl]||{}).text||"")}</textarea>`).join("") || `<p class="small mute">Pick an account first.</p>`; vh.dataset.sig = sig; }

}
async function uploadFiles(files){
  const c = cfg(); const mr = c.mediaRepo || `${c.owner}/post-queue-dashboard`; const [mo, mrn] = mr.split("/");
  if(!mo || !mrn) return say("err", "Set the media repository in Setup.");
  for(const f of files){
    if(f.size > 25*1024*1024){ say("err", `${f.name} is over 25 MB.`); continue; }
    const isVid = /^video\//.test(f.type); if(!isVid && !/^image\//.test(f.type)){ say("err", `${f.name}: only photos and MP4 videos.`); continue; }
    $("#upState").textContent = `Uploading ${f.name}…`; uploading++;
    try {
      let blob = f, name = f.name.toLowerCase().replace(/\.[a-z0-9]+$/,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "file", ext = isVid ? (/quicktime/.test(f.type)?"mov":"mp4") : "jpg";
      if(!isVid){ blob = await toJpeg(f); }
      const buf = new Uint8Array(await blob.arrayBuffer()); let s=""; for(let i=0;i<buf.length;i+=0x8000) s += String.fromCharCode.apply(null, buf.subarray(i,i+0x8000));
      const path = `media/${curWs().id}/${Date.now().toString(36)}-${name}.${ext}`;
      await gh("PUT", `/repos/${encodeURIComponent(mo)}/${encodeURIComponent(mrn)}/contents/${path}`, { message: "media: upload "+name, content: btoa(s) });
      readForm(); editing.media.push({ type: isVid?"video":"image", url: `https://raw.githubusercontent.com/${mo}/${mrn}/HEAD/${path}`, alt:"" });
      renderMedia(); refreshCompose();
    } catch(e){ say("err", `${f.name}: ${e.message} (Does the token have Contents write on ${mr}, and is that repository public?)`); }
    uploading--; $("#upState").textContent = uploading ? "" : "";
  }
}
async function toJpeg(file){
  const bmp = await createImageBitmap(file), sc = Math.min(1, 2048/Math.max(bmp.width,bmp.height));
  const c = document.createElement("canvas"); c.width = Math.max(1,Math.round(bmp.width*sc)); c.height = Math.max(1,Math.round(bmp.height*sc));
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
  return new Promise((res,rej) => c.toBlob(b => b ? res(b) : rej(new Error("could not convert the image")), "image/jpeg", 0.9));
}
async function saveEditing(intent, opts={}){
  readForm(); const p = editing;
  if(uploading) return say("warn","Wait for the upload to finish.");
  if(!p.primary.trim() && !p.media.length) return say("err","Write a caption or add media first.");
  if(!p.id){ p.id = newId(p.primary || "post"); }
  p.title = (p.title && D.posts[p.id]) ? p.title : (p.primary.trim().split("\n")[0].slice(0,50) || "Post with media");
  p.intent = intent;
  if(intent==="scheduled"){ if(opts.now) p.scheduled = { local: localFromMs(Date.now(), p.scheduled.tz), tz: p.scheduled.tz };
    const errs = validatePost(p, D.accounts||{}, true); if(errs.length){ say("err","Fix the problems listed below the form first."); refreshCompose(); return false; } }
  else { const out = {...p}; if(!(out.scheduled||{}).local) delete out.scheduled; }
  const st = D.states[p.id]; if(st && Object.values(st.targets||{}).some(t=>t.status==="published")) say("warn","This post was already published to at least one account. Editing it will not post it again.");
  try { const out = {...p}; if(intent!=="scheduled" && !(out.scheduled||{}).local) delete out.scheduled; await savePost(out); await load(); return true; }
  catch(e){ say("err", e.message); return false; }
}

  const tiles = PLATFORM_ORDER.map(pl => {
    const r = RULES[pl]; if(!r) return "";
    const built = r.status==="implemented", have = mine.filter(a=>a.platform===pl), ok = have.filter(a=>setup[a.id] && setup[a.id].ok).length;
    const state = !built ? `<span class="pill">not available yet</span>` : have.length ? (ok===have.length ? `<span class="pill published">connected</span>` : `<span class="pill uncertain">needs check</span>`) : `<span class="pill draft">ready to connect</span>`;
    return `<div class="card tile"><div class="row split"><b>${esc(r.label)}</b>${state}</div><div class="small mute" style="margin:6px 0">${built ? (have.length ? have.map(a=>esc(a.id)).join(", ") : "Not connected") : esc(r.why||"")}</div>${built ? `<button class="b ${have.length?"alt":""}" data-act="connect" data-pl="${pl}">${have.length?"Add another":"Connect"}</button>` : ""}</div>`; }).join("");
  const rows = mine.length ? `<div class="tbl"><table><thead><tr><th>Account</th><th>Platform</th><th>Last check</th><th></th></tr></thead><tbody>${mine.map(x=>{ const r = RULES[x.platform]||{}, s = setup[x.id];
    return `<tr><td>${esc(x.id)}</td><td>${esc(r.label||x.platform)}</td><td>${s?`${s.ok?"✓ "+esc(s.identity||"ok"):"✗ "+esc(s.error||"failed")} <span class="mute small">${esc(s.checked_at)}</span>`:`<span class="mute">not checked yet</span>`}</td><td><button class="b alt" data-act="rmacct" data-id="${esc(x.id)}">Remove</button></td></tr>`; }).join("")}</tbody></table></div>` : `<div class="empty">No accounts connected in ${esc(w.name)} yet.</div>`;
  const added = justAdded ? `<div class="card"><h2>Last step: add the secret values</h2><p>The account <b>${esc(justAdded.id)}</b> was added. Its credentials are <b>not</b> stored in the repository. In GitHub, edit the <code>SOCIAL_SECRETS</code> secret and add these entries (keep the existing ones):</p><pre>${esc(JSON.stringify(Object.fromEntries(Object.values(justAdded.secrets).map(n=>[n,"paste the value here"])), null, 2))}</pre><p class="row"><a class="b" href="https://github.com/${esc(c.owner)}/${esc(c.repo)}/settings/secrets/actions" target="_blank" rel="noopener noreferrer" style="text-decoration:none">Open GitHub secrets</a><button class="b alt" data-act="check">Then check accounts (read-only)</button></p><p class="small mute">The check logs in and reads the account name. It never posts.</p></div>` : "";
  return added + `<div class="card"><h2>Connect a social account to ${esc(w.name)}</h2><div class="grid wide">${tiles}</div></div>` + (connecting ? connectForm() : "") +
    `<div class="card"><h2>${esc(w.name)} accounts</h2>${rows}<p class="small mute">The repository stores only the <i>names</i> of secrets. Tokens and passwords stay in GitHub and are never shown here.</p><div class="row"><button class="b alt" data-act="check">Check accounts now (read-only)</button></div></div>`;
};
function connectForm(){
  const pl = connecting, r = RULES[pl], sp = PLATFORM_SETUP[pl], w = curWs();
  const baseId = `${w.id}-${pl.replace("_","-")}`.slice(0,30);
  return `<div class="card" id="connectCard"><h2>Connect ${esc(r.label)} to ${esc(w.name)}</h2>
  <ol class="small">${sp.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><p class="small"><a href="${esc(sp.url)}" target="_blank" rel="noopener noreferrer">Official documentation</a></p>
  <form id="connForm" novalidate><div class="cols"><div><label for="c_id">Name for this account</label><input id="c_id" value="${esc(baseId)}"></div>
  ${sp.fields.map(([k,l,ph])=>`<div><label for="c_${k}">${esc(l)}</label><input id="c_${k}" data-cf="${k}" placeholder="${esc(ph)}"></div>`).join("")}</div>
  <details style="margin-top:8px"><summary class="small">Secret names (advanced, the defaults are fine)</summary><p class="small mute">These are names under which you will store each credential in GitHub, not the credentials themselves.</p>
  <div class="cols">${sp.secrets.map(([role,nm,l])=>`<div><label for="c_s_${role}">${esc(l)}</label><input id="c_s_${role}" data-cs="${role}" data-base="${nm}" value="${esc(defaultSecretName(nm, baseId))}"></div>`).join("")}</div></details>
  <div id="connErr"></div><div class="row" style="margin-top:12px"><button type="submit" class="b">Add account</button><button type="button" class="b alt" data-act="connectcancel">Cancel</button></div></form></div>`;
}
async function addAccount(){
  const pl = connecting, sp = PLATFORM_SETUP[pl], err = m => { $("#connErr").innerHTML = `<div class="notice err">${esc(m)}</div>`; };
  const id = $("#c_id").value.trim(); const acc = { id, platform: pl, workspace: curWs().id };
  if(!/^[a-z0-9][a-z0-9_-]{1,39}$/.test(id)) return err("The name must be 2 to 40 characters: lowercase letters, digits, - or _.");
  for(const [k,l] of sp.fields){ const v = $(`[data-cf="${k}"]`).value.trim();
    if((k==="ig_user_id"||k==="page_id") && !/^\d+$/.test(v)) return err(`${l} must be numbers only.`);
    if(k==="instance" && !/^https:\/\/[a-z0-9.-]+$/i.test(v)) return err("The instance address must look like https://mastodon.social");
    acc[k] = v; }
  acc.secrets = {};
  for(const [role] of sp.secrets){ const v = $(`[data-cs="${role}"]`).value.trim(); if(!/^[A-Z][A-Z0-9_]{2,38}$/.test(v)) return err("Secret names must be capital letters, digits and _ (for example IG_TOKEN). Never type the secret value here."); acc.secrets[role] = v; }
  try {
    const f = await readFile("config/accounts.json"); const j = f ? JSON.parse(f.text) : {accounts:[]};
    j.accounts = j.accounts || [];
    if(j.accounts.some(a=>a.id===id)) return err("An account with that name already exists.");
    j.accounts.push(acc);
    await writeFile("config/accounts.json", JSON.stringify(j, null, 2)+"\n", `social: connect ${id}`, f && f.sha);
    justAdded = acc; connecting = null; await load(); render(); say("ok", `Account ${id} added. One last step below: add its secret values in GitHub.`);
  } catch(e){ err(e.message); }
}
async function removeAccount(id){
  const used = Object.keys(D.posts).filter(pid => ["scheduled","publishing","uncertain"].includes(statusOf(pid)) && (D.posts[pid].post.targets||[]).some(t=>t.account===id));
  if(used.length) return say("err", `Cannot remove ${id}: ${used.length} scheduled or in-progress post(s) still use it. Cancel or move them first.`);
  if(!await confirmBox(`Remove the account ${id}? Its secrets stay in GitHub until you delete them there.`)) return;
  try { const f = await readFile("config/accounts.json"); const j = JSON.parse(f.text); j.accounts = j.accounts.filter(a=>a.id!==id);
    await writeFile("config/accounts.json", JSON.stringify(j, null, 2)+"\n", `social: remove ${id}`, f.sha); await load(); render(); say("ok","Removed."); } catch(e){ say("err", e.message); }
}

/* ----- workspaces ----- */
V.newws = () => `<div class="card"><h2>New workspace</h2><p class="small mute">One workspace per brand or project. Its accounts, posts and calendar stay separate from the others.</p><form id="wsForm" novalidate>
  <label for="w_name">Name</label><input id="w_name" placeholder="Instagramaps">
  <label for="w_site">Website (optional)</label><input id="w_site" placeholder="https://example.com">
  <label for="w_tz">Time zone for scheduling</label><select id="w_tz">${zones().map(z=>`<option ${z===browserTz()?"selected":""}>${esc(z)}</option>`).join("")}</select>
  <div id="wsErr"></div><div class="row" style="margin-top:12px"><button type="submit" class="b">Create workspace</button>${hasWs()?`<button type="button" class="b alt" data-go="calendar">Cancel</button>`:""}</div></form></div>`;
async function createWorkspace(){
  const name = $("#w_name").value.trim(), err = m => { $("#wsErr").innerHTML = `<div class="notice err">${esc(m)}</div>`; };
  if(name.length < 2) return err("Give the workspace a name.");
  const site = $("#w_site").value.trim(); if(site && !/^https?:\/\/\S+$/.test(site)) return err("The website must start with https://");
  try {
    const f = await readFile("config/workspaces.json"); const j = f ? JSON.parse(f.text) : {workspaces:[]}; j.workspaces = j.workspaces || [];
    let id = slugify(name).replace(/^post$/,"workspace"), n = 1, base = id; while(j.workspaces.some(w=>w.id===id)){ n++; id = `${base}-${n}`; }
    j.workspaces.push({ id, name, website: site, status:"active", tz: $("#w_tz").value });
    await writeFile("config/workspaces.json", JSON.stringify(j, null, 2)+"\n", `social: create workspace ${id}`, f && f.sha);
    store.set("pq.ws", id); editing = null; await load(); go("calendar"); say("ok", `Workspace “${name}” created. Connect an account next.`);
  } catch(e){ err(e.message); }
}

V.setup = () => { const c = cfg(); return `<div class="card"><h2>Connect to GitHub</h2><p class="small mute">These stay in this browser. The token is only ever sent to api.github.com.</p>
  <div class="cols"><div><label for="s_owner">Repository owner</label><input id="s_owner" value="${esc(c.owner)}"></div><div><label for="s_repo">Queue repository</label><input id="s_repo" value="${esc(c.repo)}"></div><div><label for="s_branch">Branch</label><input id="s_branch" value="${esc(c.branch)}"></div></div>
  <label for="s_token">Fine-grained personal access token</label><input id="s_token" type="password" autocomplete="off" placeholder="${c.token?"saved in this browser":"github_pat_…"}">
  <label for="s_mr">Public repository for uploaded photos and videos (owner/name)</label><input id="s_mr" value="${esc(c.mediaRepo)}" placeholder="${esc((c.owner||"you")+"/post-queue-dashboard")}">
  <input type="hidden" id="s_path" value="${esc(c.path)}"><input type="hidden" id="s_mp" value="${esc(c.mediaPath)}">
  <div class="row" style="margin-top:12px"><button class="b" data-act="savecfg">Save and load</button><button class="b alt" data-act="forget">Forget this browser's settings</button></div></div>
  <div class="card"><h2>Token permissions</h2><ul><li>Repository access: the queue repository <b>and</b> the public media repository.</li><li><b>Contents: Read and write</b>.</li><li><b>Actions: Read and write</b>.</li><li>Nothing else. Give it an expiry (30 to 90 days) and renew it. To revoke: GitHub, Settings, Developer settings, Fine-grained tokens, Delete.</li></ul>
  <p class="small mute">Anyone with this token can write to those repositories, so treat it like a password and don't use a shared computer.</p></div>
  <div class="card"><h2>How it works</h2><ul class="small"><li>You add posts to the calendar here. They are saved as files in your queue repository.</li><li>Every hour GitHub runs the publisher, which posts what is due to each connected account and records the result. Runs can start late.</li><li>Built: Bluesky, Mastodon, Threads, Facebook Page, Instagram. Not built: X, LinkedIn, TikTok, YouTube.</li><li>A post is shown as published only after the platform confirmed it.</li></ul></div>`; };

/* ---------- wiring ---------- */
const PAGES_ = PAGES;
function nav(){ $("#nav").innerHTML = PAGES_.map(([k,l]) => `<button data-go="${k}" ${k===route?'aria-current="page"':""}>${l}</button>`).join(""); }
function wsSelect(){ const sel = $("#wsSel"), add = $("#wsAdd"); if(!D){ sel.innerHTML=""; sel.disabled = true; add.hidden = true; return; } add.hidden = false; sel.disabled = !hasWs();
  sel.innerHTML = hasWs() ? D.workspaces.map(w=>`<option value="${esc(w.id)}" ${w.id===curWs().id?"selected":""}>${esc(w.name)}</option>`).join("") : `<option>No workspace yet</option>`; }
function render(){
  nav(); wsSelect(); const v = $("#view");
  if(route==="setup"){ v.innerHTML = V.setup(); return; }
  if(!D){ v.innerHTML = `<div class="card"><h2>Connect your repository</h2><p>Open <b>Setup</b> and enter the repository and a GitHub token. Nothing is loaded until then.</p></div>`; return; }
  v.innerHTML = V[route](); if(route==="compose"){ renderMedia(); refreshCompose(); }
}
function go(r){ route = r; try { history.replaceState(null,"","#"+r); } catch(e){} render(); window.scrollTo(0,0); }
document.addEventListener("click", async ev => {
  const g = ev.target.closest("[data-go]"); if(g){ if(g.dataset.go==="compose" && route!=="compose") editing = null; go(g.dataset.go); return; }
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if(act==="newws"){ route = "newws"; return render(); }
  if(act==="newon"){ editing = blank(b.dataset.date); return go("compose"); }
  if(act==="edit"){ editing = JSON.parse(JSON.stringify(D.posts[id].post)); editing.scheduled = editing.scheduled || {local: nextHourLocal(wsTz()), tz: wsTz()}; editing.media ||= []; editing.versions ||= {}; editing.targets ||= []; return go("compose"); }
  if(act==="filter"){ filter = b.dataset.k; return render(); }
  if(act==="publishdue"){ if(!await confirmBox("Publish everything that is due right now to the real accounts?")) return; return runQueue("publish-due", true); }
  if(act==="check") return runQueue("check-setup", false);
  if(act==="calprev"||act==="calnext"){ const n = new Date(); let y = calY ?? n.getFullYear(), m = calM ?? n.getMonth(); m += act==="calnext"?1:-1; if(m<0){m=11;y--} if(m>11){m=0;y++} calY=y; calM=m; return render(); }
  if(act==="addmedia"){ readForm(); editing.media.push({type:"image",url:"",alt:""}); renderMedia(); return refreshCompose(); }
  if(act==="rmmedia"){ readForm(); editing.media.splice(+b.dataset.i,1); renderMedia(); return refreshCompose(); }
  if(act==="savedraft"){ if(await saveEditing("draft")){ say("ok","Draft saved."); go("posts"); } return; }
  if(act==="postnow"){ readForm(); if(!await confirmBox("Publish this post now to the selected accounts?")) return; const ok = await saveEditing("scheduled", {now:true}); if(!ok) return; const pid = editing.id; if(await command({action:"publish_now", post_id:pid}) && await runQueue("publish-due", true)){ say("ok","Saved and started. It is being published; press Reload in about a minute to see the result."); } go("posts"); return; }
  if(act==="delete"){ if(!await confirmBox(`Delete the draft “${D.posts[id].post.title||id}”?`)) return; try { await deleteFile(`queue/posts/${id}.json`, D.posts[id].sha, `social: delete ${id}`); editing = null; await load(); go("posts"); say("ok","Deleted."); } catch(e){ say("err", e.message); } return; }
  if(act==="cancel"){ if(!await confirmBox("Cancel this post? It will not be published.")) return; await command({action:"cancel", post_id:id}, "Cancel requested. It takes effect when the next run starts."); return; }
  if(act==="now"){ if(!await confirmBox("Publish this post now to the real accounts?")) return; if(await command({action:"publish_now", post_id:id}) && await runQueue("publish-due", true)) say("ok","Started. Press Reload in about a minute."); return; }
  if(act==="retry"){ const st = D.states[id]||{}; const unc = Object.values(st.targets||{}).some(t=>t.status==="uncertain"); if(!await confirmBox("Retry the failed account(s) of this post?"+(unc?" Some accounts are marked “check needed”: only continue if you checked that nothing was posted.":""))) return; if(await command({action:"retry", post_id:id}) && await runQueue("publish-due", true)) say("ok","Retry started."); return; }
  if(act==="resolve"){ const st = D.states[id]||{}; const acc = Object.entries(st.targets||{}).filter(([,t])=>t.status==="uncertain").map(([a])=>a); if(!acc.length) return say("info","Nothing to check on this post.");
    const url = window.__promptAnswer !== undefined ? window.__promptAnswer : window.prompt(`Look at ${acc[0]} on the platform. If the post IS there, paste its link to mark it published. If it is NOT there, leave this empty to allow a retry.`); if(url===null) return;
    if(url) await command({action:"mark_published", post_id:id, account:acc[0], url}, "Marked as published."); else await command({action:"retry", post_id:id, account:acc[0], confirm_not_posted:true}, "Retry allowed. Press “Publish due posts now” to send it."); return; }
  if(act==="connect"){ connecting = b.dataset.pl; justAdded = null; render(); const c = $("#connectCard"); if(c) c.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(act==="connectcancel"){ connecting = null; return render(); }
  if(act==="rmacct") return removeAccount(id);
  if(act==="savecfg"){ ["owner","repo","branch","path"].forEach(k => store.set("pq."+k, $("#s_"+k) ? $("#s_"+k).value.trim() : "")); if($("#s_token").value.trim()) store.set("pq.token", $("#s_token").value.trim()); store.set("pq.mediaRepo",$("#s_mr").value.trim()); store.set("pq.mediaPath",$("#s_mp").value.trim()); await load(); return go("calendar"); }
  if(act==="forget"){ ["owner","repo","branch","path","token","mediaRepo","mediaPath","ws"].forEach(k=>store.del("pq."+k)); D=null; say("ok","Forgotten."); return render(); }
});
document.addEventListener("input", ev => { if(ev.target.id==="c_id"){ document.querySelectorAll("[data-cs]").forEach(el => { el.value = defaultSecretName(el.dataset.base, ev.target.value.trim() || "x"); }); }
  if(route==="compose" && ev.target.closest("#form") && ev.target.id!=="file") refreshCompose(); });
document.addEventListener("change", ev => {
  if(ev.target.id==="file"){ const fl = [...ev.target.files]; ev.target.value = ""; uploadFiles(fl); return; }
  if(route==="compose" && ev.target.closest("#form")) refreshCompose(); });
document.addEventListener("submit", async ev => {
  if(ev.target.id==="connForm"){ ev.preventDefault(); return addAccount(); }
  if(ev.target.id==="wsForm"){ ev.preventDefault(); return createWorkspace(); }
  if(ev.target.id!=="form") return;
  ev.preventDefault();
  if(await saveEditing("scheduled")){ say("ok","Added to the calendar. It goes out on the first run after its time."); editing = null; go("calendar"); }
});
$("#wsSel").addEventListener("change", e => { store.set("pq.ws", e.target.value); editing = null; connecting = null; justAdded = null; render(); });
$("#wsAdd").addEventListener("click", () => { route = "newws"; render(); });
$("#reload").addEventListener("click", async () => { await load(); render(); });
(async function init(){
  const h = location.hash.slice(1); if(PAGES.some(p=>p[0]===h)) route = h;
  const c = cfg(); if(!c.token || !c.owner || !c.repo) route = "setup";
  await load(); if(D && !hasWs()) route = "newws"; render();
})();
</script>
</body>
